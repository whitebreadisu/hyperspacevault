<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BL-232 SEC-3: /shared/{token} pages carry the share credential in
         the URL itself; never expose it via the Referer header. Viewer mode
         has no external links today -- this makes that safe by default
         rather than by construction. -->
    <meta name="referrer" content="no-referrer" />
    <title>HyperspaceVault</title>
    <meta
      name="description"
      content="HyperspaceVault — an unofficial collection manager and price tracker for Star Wars: Unlimited."
    />
    <!-- Link-preview metadata (iMessage, Slack, Discord, social). No og:image
         yet: the app has no logo/wordmark asset (deliberately out of BL-138's
         scope); add one alongside future branding art. -->
    <meta property="og:site_name" content="HyperspaceVault" />
    <meta property="og:title" content="HyperspaceVault" />
    <meta
      property="og:description"
      content="An unofficial collection manager and price tracker for Star Wars: Unlimited."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hyperspacevault.com/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
