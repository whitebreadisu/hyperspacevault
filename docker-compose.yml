services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      # RR-11: the dev stage layers pytest/ruff on the runtime image so
      # `docker compose exec backend pytest` keeps working; CI ships the
      # runtime stage, which has neither.
      target: dev
    # ADR-0011 moved `alembic upgrade head` off the image's CMD (it's now a
    # discrete Cloud Run Job step in the deploy pipeline, not a container-start
    # concern). Local compose is a different problem: there's no promote
    # pipeline here, and auto-migrating on `docker compose up` is the dev-loop
    # convenience ADR-0011 was never targeting — so this override keeps the
    # old combined behavior for local dev only.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql://swu_app:${APP_DB_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # P5 Stage 3 (dev only): firebase-admin checks FIREBASE_AUTH_EMULATOR_HOST
      # itself and skips signature verification for emulator-issued tokens;
      # GOOGLE_CLOUD_PROJECT supplies the project id verify_id_token checks
      # the token's aud/iss claims against (no real GCP credentials needed).
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      GOOGLE_CLOUD_PROJECT: demo-swu
    depends_on:
      db:
        condition: service_healthy
      firebase-emulator:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./tcgcsv_files:/tcgcsv_files:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  # P5 Stage 3 (dev only): Firebase Auth Emulator. "demo-swu" is a reserved
  # offline project id -- firebase-tools runs the emulator against it with
  # no real GCP project or login required. Reuses the frontend image since
  # firebase-tools is already a frontend devDependency.
  #
  # Local-auth durability (owner request 2026-08-03): the emulator's account
  # store is memory-only by default -- every container stop wiped every local
  # account (postgres_data made inventory survive restarts while the accounts
  # owning it evaporated). --export-on-exit persists the store into the
  # firebase_emulator_data volume on clean shutdown; --import restores it on
  # start, but ONLY once an export exists (firebase-tools hard-errors on
  # importing a directory without export metadata, hence the conditional).
  # `exec` makes the emulator PID 1 so compose's SIGTERM reaches it directly
  # -- without it the sh wrapper swallows the signal and the export never
  # runs. stop_grace_period gives the export room before the SIGKILL.
  firebase-emulator:
    build:
      context: ./frontend
    # The export target is a SUBDIRECTORY of the mount, not the mount point
    # itself -- firebase-tools' exporter rmdir-and-recreates its target, and
    # a volume mount point can't be removed (EBUSY; proven live 2026-08-03,
    # the export silently failed and the account was lost anyway).
    command: >
      sh -c "exec npx firebase emulators:start --only auth --project demo-swu
      --export-on-exit=/emulator-data/export
      $$( [ -f /emulator-data/export/firebase-export-metadata.json ] && echo --import=/emulator-data/export )"
    stop_grace_period: 30s
    ports:
      - "9099:9099"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - firebase_emulator_data:/emulator-data

volumes:
  postgres_data:
  firebase_emulator_data:
