name: journeys-scratch

# BL-279 WS-3 W3-07: proof (dispatch, or its own PR) that the local full stack
# (.github/actions/local-stack) comes up and the verify Playwright target
# (frontend/playwright.verify.config.ts) runs journeys against it with the
# emulator sign-in (E2E_LOCAL=1). W3-17 folds this into ci.yml and deletes it.
# Triggers: workflow_dispatch only runs a workflow file that is already on the
# default branch, so the pull_request trigger (path-limited to the files this
# proof depends on) is how it proves itself on its own PR.
# The credentials below are emulator-only (project demo-swu); they are not the
# verification tenants' secrets.

on:
  pull_request:
    paths:
      - ".github/workflows/journeys-scratch.yml"
      - ".github/actions/local-stack/**"
      - "frontend/e2e/verify/**"
      - "frontend/e2e/journeys/**"
      - "frontend/playwright.verify.config.ts"
      - "backend/app/ingestion/data/fixtures/**"
  workflow_dispatch:
    inputs:
      swuapi_export_path:
        description: >
          Optional path (on the runner) to a swuapi export JSON for the
          backend's catalog bootstrap. Empty: the committed journeys fixture.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swu_inventory
          POSTGRES_USER: swu_user
          POSTGRES_PASSWORD: swu_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swu_user -d swu_inventory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://swu_user:swu_pass@localhost:5432/swu_inventory
      APP_DATABASE_URL: postgresql://swu_app:swu_app_pass@localhost:5432/swu_inventory
      APP_DB_PASSWORD: swu_app_pass

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Bring up the local stack
        id: stack
        uses: ./.github/actions/local-stack
        with:
          swuapi-export-path: ${{ inputs.swuapi_export_path }}

      - name: Seed the verification tenant
        working-directory: frontend
        env:
          E2E_LOCAL: "1"
          VERIFY_BASE_URL: ${{ steps.stack.outputs.base_url }}
          VERIFY_EMAIL: e2e@hsv.test
          VERIFY_PASSWORD: e2e-password-1
          VERIFY_FIREBASE_API_KEY: fake
        # Twice, and the two outputs must match: a seed that is not
        # idempotent would make every later journey order-dependent.
        run: |
          node e2e/verify/seed.mjs | tee "$RUNNER_TEMP/seed-1.txt"
          node e2e/verify/seed.mjs | tee "$RUNNER_TEMP/seed-2.txt"
          diff "$RUNNER_TEMP/seed-1.txt" "$RUNNER_TEMP/seed-2.txt"

      - name: Run journeys
        working-directory: frontend
        env:
          CI: "true"
          E2E_LOCAL: "1"
          VERIFY_BASE_URL: ${{ steps.stack.outputs.base_url }}
          VERIFY_EMAIL: e2e@hsv.test
          VERIFY_PASSWORD: e2e-password-1
          VERIFY_FIREBASE_API_KEY: fake
        run: npx playwright test -c playwright.verify.config.ts

      - name: Report flaky tests
        if: ${{ always() }}
        working-directory: frontend
        env:
          LEG_NAME: journeys-scratch
          FLAKY_FILE_PREFIX: frontend/e2e/journeys
        run: node e2e/report-flaky.mjs e2e-results/verify-report.json

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: journeys-scratch-playwright
          path: |
            frontend/test-results/
            frontend/e2e-results/
          retention-days: 7

      - name: Upload local-stack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: journeys-scratch-stack-logs
          path: ${{ runner.temp }}/local-stack/*.log
          retention-days: 7
