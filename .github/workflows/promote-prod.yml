name: Promote to prod

# BL-131: explicit prod promotion via workflow_dispatch.
#
# History: through 2026-07-14 prod promotion was a `promote-prod` job at the
# end of the main CI pipeline, gated by the GitHub "production" environment's
# required-reviewers rule. When the repo went private, GitHub silently removed
# that rule (environment protection is Enterprise-only on private repos),
# leaving the gate ABSENT. This workflow is the rework: the main pipeline now
# ends at deploy-dev for human-gated changes, and promotion to prod happens
# only through this dispatch — Jeremy in the Actions UI, or Claude via
# `gh workflow run promote-prod.yml -f sha=<sha>` under the standing
# "promote it" rule. The `risk:low` fast path in ci.yml is unchanged and
# still promotes in-pipeline without a human.
#
# Build-once semantics (ADR-0007) are preserved: the stated SHA's image was
# already pushed to prod AR by its main-run build-and-push job; this workflow
# deploys that image, it never rebuilds it. The promoted commit itself is
# checked out so the terraform config, frontend build, and composite action
# all match the promoted state — a dispatch always promotes a stated SHA,
# which replaces the old reject-the-stale-gate / newest-run-gate dance.
#
# Failure modes: a SHA whose image was never built (e.g. a docs-only push)
# is refused by the CI gate (BL-271 Phase E added `build-and-push` to its
# required set) before anything runs; a stale HISTORY / spec / architecture
# banner is refused by the docs gate (same phase, ADR-0033) before terraform.
# Both gates run from MAIN's copy of the scripts against the promoted SHA's
# tree, so neither can be edited away in the promoted commit and a rollback
# to an older tree is judged by today's gate logic (never by today's content
# rules). `allow_stale_notes` waives the docs gate as well as the notes date.
#
# BL-279 WS-3 stage 3e (W3-18 / W3-19, ADR-0037): two jobs.
#   gate    (environment: dev)        CI gate, notes gate, docs gate, then the
#                                     promote gate G (.github/actions/verify-gate):
#                                     journeys + platform assertions against DEV,
#                                     which must serve this SHA. Any failure stops
#                                     the workflow before terraform.
#   promote (environment: production) terraform + deploy + smoke + the
#                                     prod-current tag move, then the post-promote
#                                     check P (same action, @smoke journeys + the
#                                     assertions against PROD).
# Two jobs because the VERIFY_* secrets are scoped per GitHub environment and a
# job has one environment. P red means prod is LIVE and wrong (the paging case,
# not a refusal case): it comments on the rolling health issue and @-mentions
# the owner; there is NO rollback. The prod-current tag moves before P on
# purpose (prod IS on that SHA; a rollback is a dispatch of the previous
# prod-current SHA). allow_stale_notes (rollbacks, re-promotes) waives G only
# (dev does not serve a rolled-back SHA, so the gate cannot test it). P is
# unconditional (except on a tree that has no verify-gate action: P then prints
# a warning and the hand ladder applies): after a rollback prod serves exactly the promoted SHA, so the
# smoke journey, the assertions and A06 (--expect-sha = the promoted SHA) are
# the proof the rollback worked.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit on main to promote (full or short SHA). Its main CI run
          must have completed build-and-push (non-docs-only merge).
        required: true
        type: string
      # BL-210: the notes gate's escape hatch. A rollback or re-promote of
      # an already-shipped version carries its original (past) notes date,
      # which the gate would otherwise reject. Version-match is still
      # enforced even with this set — the date check and (BL-271 Phase E)
      # the docs gate are waived.
      allow_stale_notes:
        description: >-
          Skip the notes-date check and the docs gate (rollbacks /
          re-promotes of an already-shipped version only).
        required: false
        type: boolean
        default: false
      # ADR-0037 item 3: set only by release-train.yml. Its ONE effect: the
      # release-notes gate runs in train mode (`gate --train`: the newest entry
      # is newer than prod-current's and dated within 7 days) instead of the
      # same-day rule. The CI gate, docs gate, G, the promote and P all run
      # unchanged.
      train:
        description: >-
          Release-train dispatch (set by release-train.yml only): the notes
          gate accepts an entry newer than prod-current's dated within 7 days.
        required: false
        type: boolean
        default: false

# Serialize promotes against each other. Deliberately NOT the main pipeline's
# `main-deploy-*` group: joining it could cancel a *queued* main deploy run
# (GitHub keeps one queued run per group). Prod terraform state locking
# guards the remaining overlap case (a dispatch racing a risk:low in-pipeline
# promote) by failing one apply cleanly.
concurrency:
  group: prod-promote
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest

    # The dev environment holds the verification tenants' secrets and variables
    # (VERIFY_*); G runs against dev.
    environment: dev

    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    permissions:
      contents: read
      id-token: write
      checks: read # BL-256: the CI gate reads the promoted SHA's check runs
      actions: read # BL-279 W3-17: the CI gate reads the promoted SHA's CI run status (wait vs refuse)

    # One run at a time on the dev verification tenant (promote-prod.yml gate,
    # promote-gate-fast, verify-engines). A second PENDING run is superseded by
    # GitHub: visibly cancelled in the Actions list, never silently dropped; a
    # running one is never cancelled.
    concurrency:
      group: verify-tenant-dev
      cancel-in-progress: false
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate the requested SHA
        id: resolve
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          full=$(git rev-parse --verify --quiet "${SHA_INPUT}^{commit}") || {
            echo "::error::'${SHA_INPUT}' is not a commit in this repository"
            exit 1
          }
          if ! git merge-base --is-ancestor "$full" origin/main; then
            echo "::error::${full} is not on main — only main commits can be promoted"
            exit 1
          fi
          echo "Promoting ${full}: $(git log -1 --format='%s' "$full")"
          echo "sha=${full}" >> "$GITHUB_OUTPUT"

      # Promote the stated commit's own tree: terraform config, frontend
      # source, and the promote-prod composite action are all read from the
      # promoted SHA, not from main's tip.
      # BL-256: the promoted commit's own main-run checks (see ci_gate.sh for the set:
      # backend, frontend, frontend-e2e-mobile, journeys, build-and-push, deploy-dev) must be green -- waits for in-progress runs,
      # refuses failures and commits with no main run. Runs from main's
      # checkout so the gate itself cannot be edited away in the promoted SHA.
      - name: CI gate for the promoted SHA (BL-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci_gate.sh "${{ steps.resolve.outputs.sha }}"

      # BL-271 Phase E: keep main's copy of the docs-gate script so the gate
      # below judges the promoted tree with today's logic (like ci_gate.sh).
      - name: Stage the docs-gate script from main
        run: |
          mkdir -p /tmp/gate
          cp .github/scripts/docs_check.mjs /tmp/gate/

      - name: Check out the promoted commit
        run: git checkout --quiet "${{ steps.resolve.outputs.sha }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # BL-210: the release-notes ritual ("every prod promote carries a
      # finished notes entry, date finalized at promote time") as machinery
      # instead of memory. Runs at the promoted SHA, so it judges the notes
      # that would actually ship. Fails the promote BEFORE terraform runs.
      - name: Release-notes gate (BL-210)
        env:
          ALLOW_STALE_NOTES: ${{ inputs.allow_stale_notes }}
          TRAIN: ${{ inputs.train }}
        run: |
          if [ "$TRAIN" = "true" ]; then
            # prod-current's own newest entry key = its package.json version (trailing .0 stripped, as the gate does)
            prod_key=$(git show prod-current:frontend/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version.replace(/\.0$/,'')")
            node --experimental-strip-types .github/scripts/release_notes.mjs gate --train --prod-key "$prod_key"
          else
            node --experimental-strip-types .github/scripts/release_notes.mjs gate
          fi

      # BL-271 Phase E (ADR-0033): the release-event doc checks, at the
      # promoted SHA -- HISTORY.md's generated Releases block carries the
      # version being shipped, the spec "Last updated" banners are current,
      # the architecture views are as of this minor, the App Spec milestone
      # banner names the version -- plus INDEX.md freshness. Content checks
      # (links, citations, ...) are the PR job's business, not the gate's.
      # `allow_stale_notes` waives all of it (rollback / re-promote path).
      - name: Docs gate (BL-271 Phase E)
        env:
          ALLOW_STALE_NOTES: ${{ inputs.allow_stale_notes }}
        run: |
          if [ "$ALLOW_STALE_NOTES" = "true" ]; then
            node /tmp/gate/docs_check.mjs --gate --waive --root .
            echo "docs-gate: INDEX.md freshness skipped (allow_stale_notes)"
          else
            node /tmp/gate/docs_check.mjs --gate --root .
            # INDEX.md is judged by the promoted tree's OWN generator (the one its PR was checked with);
            # main's generator may render differently and would make every earlier SHA unpromotable.
            if [ -f .github/scripts/docs_index.mjs ]; then
              node .github/scripts/docs_index.mjs --check
            else
              echo "docs-gate: no docs_index.mjs in the promoted tree (pre-Phase D) -- INDEX.md check skipped"
            fi
          fi

      # BL-279 W3-18: promote gate G. WIF to dev (the purge's Admin SDK calls
      # use these credentials), then the shared verify-gate action against dev.
      # Runs after every cheap gate above and before anything touches prod.
      - id: auth_dev
        if: ${{ !inputs.allow_stale_notes }}
        uses: google-github-actions/auth@v3
        with:
          project_id: swu-dev-jbapps
          workload_identity_provider: projects/887823370605/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: terraform-ci@swu-dev-jbapps.iam.gserviceaccount.com

      - name: Promote gate G (journeys + platform assertions against dev)
        if: ${{ !inputs.allow_stale_notes }}
        uses: ./.github/actions/verify-gate
        timeout-minutes: 20
        with:
          base: https://swu-dev-jbapps.web.app
          env: dev
          direct: ${{ vars.VERIFY_API_DIRECT_URL }}
          expect-sha: ${{ steps.resolve.outputs.sha }}
          smoke-only: "false"
          verify-firebase-api-key: ${{ vars.VERIFY_FIREBASE_API_KEY }}
          verify-email: ${{ secrets.VERIFY_EMAIL }}
          verify-password: ${{ secrets.VERIFY_PASSWORD }}
          verify-b-email: ${{ secrets.VERIFY_B_EMAIL }}
          verify-b-password: ${{ secrets.VERIFY_B_PASSWORD }}
          verify-unverified-email: ${{ secrets.VERIFY_UNVERIFIED_EMAIL }}
          verify-unverified-password: ${{ secrets.VERIFY_UNVERIFIED_PASSWORD }}

  promote:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # BL-171: the alert address is operator-personal; the value lives in
      # the repo's Actions variable, never in the tracked tree.
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}

    # The "production" environment no longer carries protection rules (see
    # header) but tagging the job keeps GitHub's deployment history intact.
    environment: production

    permissions:
      # contents: write (was read) - BL-96: the promote-prod composite
      # action's final step force-moves the `prod-current` tag.
      contents: write
      id-token: write
      issues: write # BL-279 W3-19: P comments on the rolling health issue

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gate job resolved and validated the SHA; this job promotes that
      # commit's own tree (terraform config, frontend source, the actions).
      - name: Check out the promoted commit
        run: git checkout --quiet "${{ needs.gate.outputs.sha }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./.github/actions/promote-prod
        with:
          image_tag: ${{ needs.gate.outputs.sha }}

      # BL-210: the public repo's changelog surface — tag + GitHub Release
      # carrying the shipped entry rendered to markdown. Never fails the
      # promote (prod is already live by this point); a failure here shows
      # amber and gets fixed by re-running the mirror manually.
      - name: Mirror release notes to a GitHub Release (BL-210)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          version=$(node -p "require('./frontend/package.json').version.replace(/\.0$/,'')")
          tag="v${version}"
          if ! git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            # Annotated tags need a committer identity; the runner has none
            # (first live run failed here with exit 128, v1.4 2026-08-16 --
            # tag+release were created manually that day).
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "${tag}" "${PROMOTED_SHA}"
            git push origin "${tag}"
          fi
          node --experimental-strip-types .github/scripts/release_notes.mjs markdown "${version}" > /tmp/release_notes.md
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${tag}" --notes-file /tmp/release_notes.md
          else
            gh release create "${tag}" --title "${tag}" --notes-file /tmp/release_notes.md --verify-tag
          fi

      # BL-279 W3-19: post-promote check P, after the smoke test and the
      # prod-current tag move (both inside the promote-prod action) and after
      # the notes mirror (which never fails). Red = prod is live and wrong:
      # the action comments on the rolling health issue and the job fails.
      # No rollback.
      # Unconditional, including under allow_stale_notes (see the header): after a
      # rollback this is the proof prod serves the promoted SHA.
      # A tree older than WS-3 has no verify-gate action: warn and skip instead of
      # failing at `uses:` after prod is already live.
      - name: Post-promote check P unavailable on this tree
        if: ${{ hashFiles('.github/actions/verify-gate/action.yml') == '' }}
        run: echo "::warning::post-promote check unavailable on this tree (pre-WS-3); use the hand ladder (promote-prod recipe.md section 6)"

      - name: Post-promote check P (@smoke journeys + platform assertions against prod)
        if: ${{ hashFiles('.github/actions/verify-gate/action.yml') != '' }}
        timeout-minutes: 10
        uses: ./.github/actions/verify-gate
        with:
          base: https://www.hyperspacevault.com
          env: prod
          direct: ${{ vars.VERIFY_API_DIRECT_URL }}
          expect-sha: ${{ needs.gate.outputs.sha }}
          smoke-only: "true"
          sql-instance: swu-prod-pg
          github-token: ${{ github.token }}
          verify-firebase-api-key: ${{ vars.VERIFY_FIREBASE_API_KEY }}
          verify-email: ${{ secrets.VERIFY_EMAIL }}
          verify-password: ${{ secrets.VERIFY_PASSWORD }}
