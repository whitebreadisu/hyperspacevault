name: Docs audit

# BL-271 Phase E (ADR-0033 "audit on a schedule"): the harness, not the owner,
# is the audit trigger. Monthly (and on demand), run every documentation
# control at its strictest and the route-registry test, then write the report
# into ONE rolling GitHub issue (created on the first run, edited on every
# later one, with a comment per run so the history is readable). The run goes
# red when there are findings, so the Actions list shows the state too.
#
# What it covers (see .github/scripts/docs_audit.mjs):
#   - docs-check with every level at fail (the PR job tolerates warns)
#   - INDEX.md and HISTORY.md Releases-block freshness
#   - spec sections whose cited code changed after the section's dated banner
#   - the promote-time docs gate as it would run today
#   - backend/app/tests/test_route_registry.py (Platform Spec 1.3 registry)

on:
  schedule:
    - cron: "17 9 1 * *" # 1st of the month, 09:17 UTC (04:17 Central)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-audit
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Docs audit — rolling (BL-271 Phase E)"

jobs:
  docs-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swu_inventory
          POSTGRES_USER: swu_user
          POSTGRES_PASSWORD: swu_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swu_user -d swu_inventory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the "cited code changed" report and last-updated need history

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Documentation audit report
        id: audit
        run: node .github/scripts/docs_audit.mjs --out /tmp/audit.md

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://swu_user:swu_pass@localhost:5432/swu_inventory
          APP_DATABASE_URL: postgresql://swu_app:swu_app_pass@localhost:5432/swu_inventory
          APP_DB_PASSWORD: swu_app_pass
        run: alembic upgrade head

      - name: Route registry test (Platform Spec 1.3)
        id: registry
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgresql://swu_user:swu_pass@localhost:5432/swu_inventory
          APP_DATABASE_URL: postgresql://swu_app:swu_app_pass@localhost:5432/swu_inventory
          APP_DB_PASSWORD: swu_app_pass
        run: pytest app/tests/test_route_registry.py -q -p no:cacheprovider --no-cov 2>&1 | tee /tmp/registry.txt

      - name: Upsert the rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.audit.outputs.findings }}
          REGISTRY: ${{ steps.registry.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "_Rolling issue: edited by every run of \`.github/workflows/docs-audit.yml\`; one comment per run. Triage each finding as **drift** (spec behind code), **defect** (code behind spec) or **intentional-unbuilt** (design-stage text → private design shelf) — ADR-0033. Close only by fixing the findings; the next run reopens it if any remain._"
            echo
            echo "**Route registry test (\`backend/app/tests/test_route_registry.py\`): ${REGISTRY}**"
            echo
            echo '```'
            tail -n 20 /tmp/registry.txt
            echo '```'
            echo
            cat /tmp/audit.md
            echo
            echo "Run: ${RUN_URL}"
          } > /tmp/body.md
          number=$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title \
            --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1)
          if [ -z "$number" ]; then
            number=$(gh issue create --title "${ISSUE_TITLE}" --label "type:chore" --label "area:docs" --body-file /tmp/body.md | grep -oE '[0-9]+$')
            echo "created issue #${number}"
          else
            gh issue edit "$number" --body-file /tmp/body.md
            echo "updated issue #${number}"
          fi
          gh issue comment "$number" --body "Run $(date -u +%Y-%m-%d): **${FINDINGS} docs finding(s)**, route registry **${REGISTRY}** — ${RUN_URL}"

      - name: Red when there are findings
        env:
          FINDINGS: ${{ steps.audit.outputs.findings }}
          REGISTRY: ${{ steps.registry.outcome }}
        run: |
          if [ "${FINDINGS:-0}" != "0" ] || [ "$REGISTRY" != "success" ]; then
            echo "::error::docs-audit: ${FINDINGS} finding(s), route registry ${REGISTRY} — see the rolling issue"
            exit 1
          fi
          echo "docs-audit: clean"
