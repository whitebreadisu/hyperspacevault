name: Docs check

# BL-271 Phase B: ci.yml's `docs-check` job covers every PR (it feeds ci-ok)
# and every main push that triggers ci.yml. A docs-only push to main triggers
# NO ci.yml run (BL-167 paths-ignore), so this workflow runs the same check
# for exactly that case: the `paths` list below MUST mirror ci.yml's push
# `paths-ignore` list. No node_modules, no secrets.
on:
  push:
    branches: [main]
    paths:
      - "specification_documents/**"
      - "docs/**"
      - "learning_guide/**"
      - "claude_design/**"
      - ".design-sync/**"
      - "*.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check (docs-only push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Docs-check tests
        run: node .github/scripts/docs_check.test.mjs

      - name: Docs-check on the tree
        run: node .github/scripts/docs_check.mjs
